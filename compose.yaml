x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    container_name: max_postgres
    environment:
      POSTGRES_DB: maxapp
      POSTGRES_USER: max
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U max -d maxapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://max:${POSTGRES_PASSWORD}@postgres:5432/maxapp
      MAX_TOKEN: ${MAX_TOKEN:?set MAX_TOKEN in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-false}
      DEMO: ${DEMO:-true}
      MAX_INIT_DATA_MAX_AGE: ${MAX_INIT_DATA_MAX_AGE:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_bot
    command: ["python", "backend/bot/main_longpooling.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://max:${POSTGRES_PASSWORD}@postgres:5432/maxapp
      MAX_TOKEN: ${MAX_TOKEN:?set MAX_TOKEN in .env}
      DEBUG: ${DEBUG:-false}
      DEMO: ${DEMO:-true}
      MSP_FULL_REFRESH: ${MSP_FULL_REFRESH:-false}
      LAW_PDF: ${LAW_PDF:-false}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: max_postgres
    environment:
      POSTGRES_DB: maxapp
      POSTGRES_USER: max
      POSTGRES_PASSWORD: max
    ports:
      - "127.0.0.1:5433:5432"  # только с самого сервера: пароль в этом файле
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U max -d maxapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_backend
    ports:
      - "127.0.0.1:8000:8000"  # снаружи — через Caddy (HTTPS)
    environment:
      DATABASE_URL: postgresql+asyncpg://max:max@postgres:5432/maxapp
      MAX_TOKEN: ${MAX_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-true}
      MAX_INIT_DATA_MAX_AGE: ${MAX_INIT_DATA_MAX_AGE:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_bot
    command: ["python", "backend/bot/main_longpooling.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://max:max@postgres:5432/maxapp
      MAX_TOKEN: ${MAX_TOKEN}
      DEBUG: ${DEBUG:-true}  # true — включены демо-команды /demo_remind и /demo_event
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

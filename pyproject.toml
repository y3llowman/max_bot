[project]
name = "max-miniapp-fastapi"
version = "0.2.0"
description = "Радар обязанностей для малого бизнеса: бот и мини-приложение в MAX"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "pydantic-settings==2.11.0",
    "python-jose[cryptography]==3.5.0",
    "pymupdf==1.28.2",
    "maxapi==1.2.2",
    "python-dotenv==1.1.1",
    "apscheduler==3.11.3",
    "requests==2.34.2",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "python-docx==1.2.0",
    "alembic==1.20.0",
    "pyyaml==6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
